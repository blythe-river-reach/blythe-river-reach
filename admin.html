<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River marks — review</title>
<style>
  :root{color-scheme:dark light}
  body{font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; padding:16px; max-width:900px; margin:0 auto; background:#0f1722; color:#e6edf3}
  @media (prefers-color-scheme: light){ body{background:#f5f7fa; color:#1b2430} .card{background:#fff !important; border-color:#d9dee6 !important} }
  h1{font-size:20px; margin:0 0 12px} h2{font-size:16px; margin:22px 0 8px; color:#8fb3d9}
  .card{background:#16202c; border:1px solid #27354a; border-radius:12px; padding:12px 14px; margin:8px 0}
  .row{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap} .grow{flex:1; min-width:220px}
  .tag{font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:999px; border:1px solid #27354a; color:#9fb0c3}
  .tag.pending{color:#f2b64a; border-color:#f2b64a} .tag.approved{color:#5cd18d; border-color:#5cd18d} .tag.hidden,.tag.flagged{color:#f27b7b; border-color:#f27b7b}
  .muted{color:#9fb0c3; font-size:13px} .mono{font-family:ui-monospace,Menlo,monospace}
  button{font:inherit; padding:7px 12px; border-radius:9px; border:1px solid #27354a; background:#1f2b3b; color:#e6edf3; cursor:pointer} button.ok{border-color:#5cd18d} button.bad{border-color:#f27b7b}
  input{font:inherit; padding:8px 10px; border-radius:9px; border:1px solid #27354a; background:#0f1722; color:inherit; min-width:260px}
  a{color:#7fc3ff}
</style></head><body>
<h1>Depth marks — review queue</h1>
<div class="row"><input id="key" type="password" placeholder="admin key"><button id="load">Load</button><span class="muted" id="status"></span></div>
<div id="out"></div>
<script>
var KEY_STORE="blythe_admin_key"; try{ document.getElementById("key").value=localStorage.getItem(KEY_STORE)||""; }catch(e){}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function api(method, body){ var k=document.getElementById("key").value.trim(); try{ localStorage.setItem(KEY_STORE,k); }catch(e){} return fetch("/api/marks-admin",{method:method, headers:{"x-admin-key":k,"content-type":"application/json"}, body:body?JSON.stringify(body):undefined}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||r.status); return j; }); }); }
function when(s){ try{ return new Date(s).toLocaleString("en-US",{timeZone:"America/Phoenix"}); }catch(e){ return s; } }
function pin(r){ return (r.lat!=null&&r.lon!=null) ? ' · <a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+r.lat+','+r.lon+'">map pin</a>' : ' · no pin'; }
function btns(type, r){ var b=""; if(type==="reading"){ b+='<button class="ok" data-a="ok">Accept</button><button class="bad" data-a="hide">Hide</button>'; } else { if(r.status!=="approved") b+='<button class="ok" data-a="approve">Approve</button>'; if(r.status!=="hidden") b+='<button class="bad" data-a="hide">Hide</button>'; if(r.status==="hidden") b+='<button data-a="pending">Back to pending</button>'; } b+='<button class="bad" data-a="delete">Delete</button>'; return '<div class="row" data-type="'+type+'" data-id="'+r.id+'">'+b+'</div>'; }
function render(q){
  var out=document.getElementById("out"), h="";
  var order={pending:0, approved:1, hidden:2}; var srt=function(a,b){ return (order[a.status]||0)-(order[b.status]||0) || (a.createdAt<b.createdAt?1:-1); };
  h+='<h2>Places added by users ('+q.places.length+')</h2>'; if(!q.places.length) h+='<p class="muted">None yet.</p>';
  q.places.slice().sort(srt).forEach(function(p){ h+='<div class="card"><div class="row"><div class="grow"><b>'+esc(p.name)+'</b> <span class="tag '+p.status+'">'+p.status+'</span><div class="muted">river mile <span class="mono">'+p.mile+'</span>'+pin(p)+' · added '+when(p.createdAt)+' · device <span class="mono">'+esc(String(p.owner||"").slice(0,8))+'</span>'+(p.note?'<br>'+esc(p.note):'')+'</div></div>'+btns("place",p)+'</div></div>'; });
  h+='<h2>Marks ('+q.marks.length+')</h2>'; if(!q.marks.length) h+='<p class="muted">None yet.</p>';
  q.marks.slice().sort(srt).forEach(function(m){ var lad=(m.ladder||[]).map(function(r){ return esc(r.label)+(r.h!=null?' ('+r.h+' ft)':''); }).join(' → '); h+='<div class="card"><div class="row"><div class="grow"><b>'+esc(m.name)+'</b> <span class="tag '+m.status+'">'+m.status+'</span> <span class="muted">at <span class="mono">'+esc(m.spot)+'</span></span><div>'+esc(m.ref)+'</div><div class="muted">'+(lad?'ladder: '+lad+'<br>':'')+pin(m).replace(/^ · /,'')+' · added '+when(m.createdAt)+' · device <span class="mono">'+esc(String(m.owner||"").slice(0,8))+'</span></div></div>'+btns("mark",m)+'</div></div>'; });
  h+='<h2>Flagged readings ('+q.readings.length+')</h2>'; if(!q.readings.length) h+='<p class="muted">Nothing flagged.</p>';
  q.readings.forEach(function(r){ var what=r.kind==="depth"?r.depth+' ft':(r.kind+' '+r.rung+(r.rung2?'–'+r.rung2:'')); h+='<div class="card"><div class="row"><div class="grow"><b>'+esc(what)+'</b> <span class="tag flagged">flagged</span> <span class="muted">mark <span class="mono">'+esc(r.mark)+'</span> · read '+when(r.t)+'</span><div class="muted">'+esc(r.why||'')+' · modeled stage <span class="mono">'+r.stage+'</span> ft, '+r.cfs+' cfs'+(r.note?'<br>note: '+esc(r.note):'')+'</div></div>'+btns("reading",r)+'</div></div>'; });
  h+='<p class="muted">Totals: '+q.counts.places+' places · '+q.counts.marks+' marks · '+q.counts.readings+' readings.</p>';
  out.innerHTML=h;
}
function load(){ var st=document.getElementById("status"); st.textContent="Loading…"; api("GET").then(function(q){ st.textContent="Loaded "+new Date().toLocaleTimeString(); render(q); }).catch(function(e){ st.textContent="Error: "+e.message; }); }
document.getElementById("load").addEventListener("click", load);
document.getElementById("out").addEventListener("click", function(ev){ var b=ev.target.closest("button"); if(!b) return; var row=b.closest("[data-type]"); var a=b.getAttribute("data-a"); if(a==="delete" && !confirm("Delete permanently?")) return; api("POST",{type:row.getAttribute("data-type"), id:row.getAttribute("data-id"), action:a}).then(load).catch(function(e){ alert(e.message); }); });
if(document.getElementById("key").value) load();
</script></body></html>
