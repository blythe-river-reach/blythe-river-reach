<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{color-scheme:dark light; --bg:#0d1520; --panel:#141f2d; --panel2:#1b283a; --border:#2a3a50; --text:#e7eef6; --muted:#9db0c4; --water:#38bde0; --ok:#5cd18d; --warn:#f2b64a; --bad:#f27b7b}
  @media (prefers-color-scheme: light){ :root{--bg:#f3f6fa; --panel:#fff; --panel2:#eef3f8; --border:#d6dee8; --text:#16202c; --muted:#5d6f84} }
  *{box-sizing:border-box} body{font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; background:var(--bg); color:var(--text)}
  .wrap{max-width:1000px; margin:0 auto; padding:16px}
  header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px} header h1{font-size:20px; margin:0; flex:1}
  input,select{font:inherit; padding:8px 10px; border-radius:9px; border:1px solid var(--border); background:var(--panel); color:inherit}
  button{font:inherit; padding:7px 12px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer} button:hover{border-color:var(--water)}
  button.ok{border-color:var(--ok)} button.bad{border-color:var(--bad)} button.primary{background:var(--water); color:#06121c; border-color:var(--water); font-weight:700}
  .muted{color:var(--muted); font-size:13px} .mono{font-family:ui-monospace,Menlo,monospace}
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:12px 0}
  .tile{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px} .tile b{display:block; font-size:24px} .tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)}
  .switch{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin:12px 0}
  .switch .st{font-weight:700} .switch .st.on{color:var(--ok)} .switch .st.off{color:var(--warn)}
  .tabs{display:flex; gap:6px; margin:16px 0 10px; flex-wrap:wrap} .tabs button.on{border-color:var(--water); color:var(--water); font-weight:700}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin:10px 0}
  .card.pending{border-left:4px solid var(--warn)} .card.flagged{border-left:4px solid var(--bad)}
  .row{display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap} .grow{flex:1; min-width:240px}
  .acts{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px}
  .tag{font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted)}
  .tag.pending{color:var(--warn); border-color:var(--warn)} .tag.approved{color:var(--ok); border-color:var(--ok)} .tag.hidden,.tag.flagged{color:var(--bad); border-color:var(--bad)} .tag.ok{color:var(--ok); border-color:var(--ok)}
  img.ph{width:132px; height:99px; object-fit:cover; border-radius:10px; background:var(--panel2); cursor:zoom-in}
  table{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:8px} th,td{text-align:left; padding:6px 8px; border-top:1px solid var(--border); vertical-align:top} th{color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.05em}
  details summary{cursor:pointer; color:var(--water); font-size:13px; margin-top:8px}
  a{color:var(--water)} h2{font-size:16px; margin:18px 0 6px}
  #lb{position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; z-index:9; cursor:zoom-out} #lb.open{display:flex} #lb img{max-width:96vw; max-height:92vh; border-radius:10px}
  .empty{color:var(--muted); padding:10px 4px}
</style></head><body><div class="wrap">
<header><h1>River admin</h1><input id="key" type="password" placeholder="admin key" style="min-width:200px"><button class="primary" id="load">Load</button><span class="muted" id="status"></span></header>
<div id="app"><p class="muted">Enter the admin key (the push run key unless you set ADMIN_KEY) and load.</p></div>
<div id="lb"><img alt=""></div>
<script>
var KEY_STORE="blythe_admin_key", Q=null, TAB="review", DATA=null;
function branch(){ var h=location.hostname||""; if(/^dev--/.test(h)||/localhost|127\.0\.0\.1/.test(h)) return "dev"; var m=h.match(/^([a-z0-9-]+)--/); return m?m[1]:"main"; }
function loadData(){ var b=branch(), f=b==="main"?"/data/riverdata.json":"/data/riverdata-"+b+".json"; return fetch(f+"?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){ DATA=d; }).catch(function(){ DATA=null; }); }
function ageTxt(t){ var m=Math.round((Date.now()-t)/60000); if(m<1) return "just now"; if(m<60) return m+" min"; var h=m/60; if(h<48) return h.toFixed(1)+" h"; return Math.round(h/24)+" d"; }
function healthHtml(){
  if(!DATA) return '<p class="empty">Couldn\u2019t load the data file for this branch.</p>';
  var d=DATA, gen=new Date(d.generatedAt).getTime(), h="";
  var stale=Date.now()-gen>60*60000;
  h+='<div class="tiles"><div class="tile'+(stale?' bad':'')+'"><b>'+ageTxt(gen)+'</b><span class="muted">since the robot last ran ('+when(d.generatedAt)+')</span></div>';
  var ps=d.parkerSchedule&&d.parkerSchedule.points&&d.parkerSchedule.points.length?d.parkerSchedule.points[d.parkerSchedule.points.length-1].t:null;
  h+='<div class="tile'+(ps&&ps-Date.now()<24*3600e3?' warn':'')+'"><b>'+(ps?((ps-Date.now())/3600e3).toFixed(0)+' h':'\u2014')+'</b><span class="muted">of Parker plan ahead'+(ps?' (to '+when(ps)+')':'')+'</span></div>';
  var u=d.usgs; h+='<div class="tile'+(!u?' bad':(u.carried?' warn':''))+'"><b>'+(u?ageTxt(new Date(u.fetchedAt).getTime()):'\u2014')+'</b><span class="muted">USGS relay age'+(u&&u.carried?' \u00b7 carried: '+esc(u.carried):'')+'</span></div>';
  h+='<div class="tile'+((d.errors||[]).length?' warn':'')+'"><b>'+(d.errors||[]).length+'</b><span class="muted">robot notes this run</span></div></div>';
  if((d.errors||[]).length) h+='<div class="card"><b>Robot notes</b><ul class="muted" style="margin:6px 0 0; padding-left:18px">'+d.errors.map(function(e){ return '<li>'+esc(e)+'</li>'; }).join("")+'</ul></div>';
  h+='<div class="card"><b>Sensors</b><table><tr><th>Station</th><th>Newest reading</th><th>Age</th><th>Flow</th><th>Stage</th></tr>'+(d.stations||[]).map(function(s){ var f=s.flow&&s.flow.length?s.flow[s.flow.length-1]:null, g=s.stage&&s.stage.length?s.stage[s.stage.length-1]:null, t=Math.max(f?f.t:0,g?g.t:0); var old=t&&Date.now()-t>3*3600e3; return '<tr><td>'+esc(s.name)+'</td><td>'+(t?when(t):'\u2014')+'</td><td'+(old?' style="color:var(--bad)"':'')+'>'+(t?ageTxt(t):'\u2014')+'</td><td class="mono">'+(f?Math.round(f.v).toLocaleString()+' cfs':'')+'</td><td class="mono">'+(g?g.v.toFixed(2)+' ft':'')+'</td></tr>'; }).join("")+'</table></div>';
  var c=d.calibration; if(c) h+='<div class="card"><b>Travel-time calibration</b> <span class="muted">river-wide '+c.waveMph+' mph \u00b7 spread '+(c.dispHPerMile!=null?c.dispHPerMile+' h/mi':'\u2014')+' \u00b7 gain '+(c.gainPerMile!=null?c.gainPerMile+'/mi':'\u2014')+' \u00b7 flow exponent '+(c.betaFlow!=null?c.betaFlow:'\u2014')+'</span><table><tr><th>Stretch</th><th>Lag</th><th>Speed</th><th>Spread</th><th>Gain</th><th>Flow exp.</th><th>Fit r</th></tr>'+(c.segments||[]).map(function(s){ return '<tr><td>'+esc(s.from)+' \u2192 '+esc(s.to)+' <span class="muted">'+s.miles+' mi</span></td><td class="mono">'+s.lagHours+' h</td><td class="mono">'+s.mph+' mph</td><td class="mono">'+(s.sigmaH!=null?s.sigmaH+' h':'')+'</td><td class="mono">'+(s.gain!=null?s.gain:'')+'</td><td class="mono">'+(s.beta!=null?s.beta:'')+'</td><td class="mono">'+s.r+'</td></tr>'; }).join("")+'</table></div>';
  var o=d.outlook; if(o&&o.skill){
    var sk="";
    ["parker","davis"].forEach(function(dam){ var k=o.skill[dam]||{}, buckets=Object.keys(k); var pend=(o.scoring&&o.scoring[dam]&&o.scoring[dam].pending||[]).length;
      sk+='<div style="margin-top:8px"><b style="text-transform:capitalize">'+dam+' Dam</b> ';
      if(!buckets.length){ sk+='<span class="muted">no scored days yet \u2014 '+pend+' projected days waiting to be checked as they arrive</span></div>'; return; }
      sk+='<span class="muted">'+pend+' waiting</span><table><tr><th>Days ahead</th><th>Days scored</th><th>Typical error</th><th>9 in 10 within</th></tr>'+buckets.map(function(b){ var v=k[b]; return '<tr><td>'+esc(b)+'</td><td class="mono">'+v.n+'</td><td class="mono">'+(v.medPct!=null?Math.round(v.medPct)+'%':'')+'</td><td class="mono">'+(v.p90Pct!=null?Math.round(v.p90Pct)+'%':'')+'</td></tr>'; }).join("")+'</table></div>'; });
    h+='<div class="card"><b>14-day outlook skill</b> <span class="muted">(how far the rhythm-based projection has missed the day\u2019s average release, by how far ahead it was made)</span>'+sk+'</div>';
  }
  return h;
}
function pushHtml(){
  var p=Q.push; if(!p) return '<p class="empty">No subscriber data.</p>'; if(p.error) return '<p class="empty">Couldn\u2019t read subscribers: '+esc(p.error)+'</p>';
  var rows=Object.keys(p.bySpot||{}).sort(function(a,b){ return p.bySpot[b]-p.bySpot[a]; }).map(function(k){ return '<tr><td>'+esc(spotName(k))+'</td><td class="mono">'+p.bySpot[k]+'</td></tr>'; }).join("");
  return '<div class="tiles"><div class="tile"><b>'+p.total+'</b><span class="muted">push subscribers</span></div></div><div class="card"><div class="row"><div class="grow"><b>Run alerts now</b><div class="muted">Evaluates every subscriber against the newest data for this branch and sends whatever is due, exactly as the robot does after each run. Nothing is sent twice.</div></div><button id="runalerts">Run now</button></div><div class="muted" id="runalerts-out" style="margin-top:6px"></div></div>'+(rows?'<div class="card"><b>By spot</b><table><tr><th>Spot</th><th>Subscribers</th></tr>'+rows+'</table></div>':'');
}
function localInput(iso){ if(!iso) return ""; var d=new Date(iso); var p=function(n){ return (n<10?"0":"")+n; }; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
function noticeHtml(){
  var n=Q.flags&&Q.flags.notice, now=Date.now();
  var state=!n?"":(n.from&&new Date(n.from).getTime()>now)?'<span style="color:var(--water)">scheduled</span>':(n.until&&new Date(n.until).getTime()<=now)?'<span style="color:var(--warn)">expired</span>':'<span style="color:var(--ok)">showing now</span>';
  return '<div class="card"><b>Site notice</b><div class="muted">A short message shown near the top of every page, for things like a maintenance release or a closed ramp. Start and end are optional: leave start empty to show it right away, end empty to keep it up until you clear it. Times are your device\u2019s local time.</div>'+
    (n?'<div class="muted" style="margin-top:6px">Current: \u201c'+esc(n.text)+'\u201d'+(n.from?' \u00b7 from '+when(n.from):'')+(n.until?' \u00b7 until '+when(n.until):'')+' \u00b7 '+state+'</div>':'<div class="muted" style="margin-top:6px">No notice set.</div>')+
    '<div class="row" style="margin-top:8px"><input id="nt-text" class="grow" maxlength="280" placeholder="Message" value="'+esc(n?n.text:'')+'"><select id="nt-level"><option value="info"'+(n&&n.level!=="warn"?' selected':'')+'>Info</option><option value="warn"'+(n&&n.level==="warn"?' selected':'')+'>Warning</option></select></div>'+
    '<div class="row" style="margin-top:8px"><label class="muted">Start <input id="nt-from" type="datetime-local" value="'+localInput(n&&n.from)+'"></label><label class="muted">End <input id="nt-until" type="datetime-local" value="'+localInput(n&&n.until)+'"></label><button class="primary" id="nt-save">Save notice</button>'+(n?'<button class="bad" id="nt-clear">Clear notice</button>':'')+'</div></div>';
}
try{ document.getElementById("key").value=localStorage.getItem(KEY_STORE)||""; }catch(e){}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function key(){ var k=document.getElementById("key").value.trim(); try{ localStorage.setItem(KEY_STORE,k); }catch(e){} return k; }
function api(method, body){ return fetch("/api/marks-admin",{method:method, headers:{"x-admin-key":key(),"content-type":"application/json"}, body:body?JSON.stringify(body):undefined, cache:"no-store"}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j; }); }); }
function when(s){ try{ return new Date(s).toLocaleString("en-US",{timeZone:"America/Phoenix", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); }catch(e){ return String(s); } }
function ago(t){ var m=Math.round((Date.now()-new Date(t).getTime())/60000); if(m<60) return m+" min ago"; var h=Math.round(m/60); if(h<48) return h+" h ago"; return Math.round(h/24)+" d ago"; }
function spotName(k){ if(!Q) return k; if(/^u:/.test(k)){ var p=(Q.places||[]).find(function(x){ return "u:"+x.id===k; }); return p?p.name+" (user place)":k; } return (Q.spots&&Q.spots[k])||k; }
function pin(r){ return (r.lat!=null&&r.lon!=null) ? '<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+r.lat+','+r.lon+'">map pin</a>' : '<span class="muted">no pin</span>'; }
function dev(r){ return '<span class="mono" title="'+esc(r.owner||"")+'">'+esc(String(r.owner||"").slice(2,8))+'</span>'; }
function readingText(r){ if(r.kind==="depth") return r.depth+" ft"; var m=(Q.marks||[]).find(function(x){ return x.id===r.mark; }); var lbl=function(id){ var g=m&&(m.ladder||[]).find(function(x){ return x.id===id; }); return g?g.label:id; }; if(r.kind==="rung") return "at "+lbl(r.rung); if(r.kind==="between") return "between "+lbl(r.rung)+" and "+lbl(r.rung2)+(r.frac!=null?" ("+Math.round(r.frac*100)+"%)":""); if(r.kind==="over") return "over "+lbl(r.rung); if(r.kind==="under") return "below "+lbl(r.rung); return r.kind; }
function actsPlace(p){ return '<div class="acts" data-type="place" data-id="'+p.id+'">'+(p.status!=="approved"?'<button class="ok" data-a="approve">Approve</button>':'')+(p.status!=="hidden"?'<button class="bad" data-a="hide">Hide</button>':'<button data-a="pending">Back to pending</button>')+'<label class="muted">mile <input class="mile" type="number" step="0.1" min="40" max="280" value="'+p.mile+'" style="width:90px"></label><button data-a="setmile">Set</button><button class="bad" data-a="delete">Delete</button></div>'; }
function actsMark(m){ return '<div class="acts" data-type="mark" data-id="'+m.id+'">'+(m.status!=="approved"?'<button class="ok" data-a="approve">Approve</button>':'')+(m.status!=="hidden"?'<button class="bad" data-a="hide">Hide</button>':'<button data-a="pending">Back to pending</button>')+(m.photo?'<button data-a="unphoto">Remove photo</button>':'')+'<button class="bad" data-a="delete">Delete</button></div>'; }
function actsReading(r){ return '<span class="acts" style="margin:0" data-type="reading" data-id="'+r.id+'">'+(r.status!=="ok"?'<button class="ok" data-a="ok">Accept</button>':'')+(r.status!=="hidden"?'<button class="bad" data-a="hide">Hide</button>':'')+'<button class="bad" data-a="delete">Delete</button></span>'; }
function placeCard(p){ return '<div class="card '+p.status+'"><div class="row"><div class="grow"><b>'+esc(p.name)+'</b> <span class="tag '+p.status+'">'+p.status+'</span><div class="muted">river mile <span class="mono">'+p.mile+'</span> \u00b7 '+pin(p)+' \u00b7 added '+when(p.createdAt)+' ('+ago(p.createdAt)+') \u00b7 device '+dev(p)+(p.note?'<br>'+esc(p.note):'')+'</div></div></div>'+actsPlace(p)+'</div>'; }
function readingsTable(rs){ if(!rs.length) return '<p class="empty">No readings yet.</p>'; return '<table><tr><th>When read</th><th>Reading</th><th>Modeled</th><th>Status</th><th></th></tr>'+rs.map(function(r){ return '<tr><td>'+when(r.t)+'</td><td>'+esc(readingText(r))+(r.note?'<br><span class="muted">'+esc(r.note)+'</span>':'')+'</td><td class="mono">'+(r.stage!=null?r.stage.toFixed(2)+' ft':'')+(r.cfs!=null?'<br>'+r.cfs.toLocaleString()+' cfs':'')+'</td><td><span class="tag '+r.status+'">'+r.status+'</span>'+(r.why?'<div class="muted">'+esc(r.why)+'</div>':'')+'</td><td>'+actsReading(r)+'</td></tr>'; }).join("")+'</table>'; }
function markCard(m){
  var rs=(Q.readings||[]).filter(function(r){ return r.mark===m.id; }), pinned=(m.ladder||[]).filter(function(r){ return r.px; }).length;
  var lad=(m.ladder||[]).length?'<div class="muted">ladder: '+(m.ladder).map(function(r){ return (r.px?'\u25cf ':'\u25cb ')+esc(r.label)+(r.h!=null?' ('+r.h+' ft)':''); }).join(' \u2192 ')+' \u00b7 '+pinned+'/'+m.ladder.length+' placed on the photo</div>':'<div class="muted">no landmarks</div>';
  return '<div class="card '+m.status+'"><div class="row">'+(m.photo?'<img class="ph" data-photo="'+m.id+'" alt="">':'')+'<div class="grow"><b>'+esc(m.name)+'</b> <span class="tag '+m.status+'">'+m.status+'</span> <span class="muted">at '+esc(spotName(m.spot))+'</span><div>'+esc(m.ref)+'</div>'+lad+'<div class="muted">'+pin(m)+' \u00b7 added '+when(m.createdAt)+' ('+ago(m.createdAt)+') \u00b7 device '+dev(m)+' \u00b7 '+rs.length+' reading'+(rs.length===1?'':'s')+(rs.filter(function(r){ return r.status==="flagged"; }).length?' \u00b7 <span style="color:var(--bad)">'+rs.filter(function(r){ return r.status==="flagged"; }).length+' flagged</span>':'')+'</div></div></div>'+actsMark(m)+'<details'+(TAB==="readings"?' open':'')+'><summary>Readings ('+rs.length+')</summary>'+readingsTable(rs)+'</details></div>';
}
function render(){
  var q=Q, c=q.counts||{}, on=!!(q.flags&&q.flags.marksEnabled), h="";
  h+='<div class="switch"><div class="grow"><b>Landmarks &amp; depth marks on the site</b><div class="muted">Off hides the whole feature from visitors (picker rows, panel, add buttons). Everything stays stored; switch it back on any time.'+(q.flags&&q.flags.updatedAt?' Changed '+when(q.flags.updatedAt)+'.':'')+'</div></div><span class="st '+(on?'on':'off')+'">'+(on?'ON':'OFF')+'</span><button class="primary" id="toggle">'+(on?'Turn off':'Turn on')+'</button></div>';
  h+='<div class="tiles"><div class="tile'+(c.pendingPlaces?' warn':'')+'"><b>'+(c.pendingPlaces||0)+'</b><span class="muted">places to review</span></div><div class="tile'+(c.pendingMarks?' warn':'')+'"><b>'+(c.pendingMarks||0)+'</b><span class="muted">marks to review</span></div><div class="tile'+(c.flagged?' bad':'')+'"><b>'+(c.flagged||0)+'</b><span class="muted">flagged readings</span></div><div class="tile"><b>'+(c.readings||0)+'</b><span class="muted">readings in all \u00b7 '+(c.marks||0)+' marks \u00b7 '+(c.places||0)+' places</span></div></div>';
  var tabs=[["review","Needs review"],["all","All"],["places","Places"],["marks","Marks"],["readings","Readings"],["health","Data health"],["push","Notifications"],["notice","Site notice"]];
  h+='<div class="tabs">'+tabs.map(function(t){ return '<button data-tab="'+t[0]+'"'+(TAB===t[0]?' class="on"':'')+'>'+t[1]+'</button>'; }).join("")+'</div>';
  var order={pending:0, approved:1, hidden:2}, srt=function(a,b){ return (order[a.status]||0)-(order[b.status]||0) || (a.createdAt<b.createdAt?1:-1); };
  if(TAB==="all"){ /* handled below */ }
  if(TAB==="review"){
    var pp=q.places.filter(function(p){ return p.status==="pending"; }), pm=q.marks.filter(function(m){ return m.status==="pending"; }), fr=q.readings.filter(function(r){ return r.status==="flagged"; });
    h+='<h2>Places waiting ('+pp.length+')</h2>'+(pp.length?pp.map(placeCard).join(""):'<p class="empty">Nothing waiting.</p>');
    h+='<h2>Marks waiting ('+pm.length+')</h2>'+(pm.length?pm.map(markCard).join(""):'<p class="empty">Nothing waiting.</p>');
    h+='<h2>Flagged readings ('+fr.length+')</h2>'+(fr.length?'<div class="card flagged">'+readingsTable(fr)+'</div>':'<p class="empty">Nothing flagged.</p>');
  } else if(TAB==="places"){ h+=q.places.length?q.places.slice().sort(srt).map(placeCard).join(""):'<p class="empty">No user places yet.</p>'; }
  else if(TAB==="marks"){ h+=q.marks.length?q.marks.slice().sort(srt).map(markCard).join(""):'<p class="empty">No marks yet.</p>'; }
  else if(TAB==="readings"){ h+=q.marks.length?q.marks.slice().sort(srt).map(markCard).join(""):'<p class="empty">No marks, so no readings.</p>'; }
  else if(TAB==="all"){ h+='<h2>Places ('+q.places.length+')</h2>'+(q.places.length?q.places.slice().sort(srt).map(placeCard).join(""):'<p class="empty">None.</p>')+'<h2>Marks ('+q.marks.length+') and their readings</h2>'+(q.marks.length?q.marks.slice().sort(srt).map(markCard).join(""):'<p class="empty">None.</p>'); }
  else if(TAB==="health"){ h+=healthHtml(); }
  else if(TAB==="push"){ h+=pushHtml(); }
  else if(TAB==="notice"){ h+=noticeHtml(); }
  document.getElementById("app").innerHTML=h;
  var k=key(); document.querySelectorAll("img.ph").forEach(function(img){ fetch("/api/marks-admin?photo="+encodeURIComponent(img.getAttribute("data-photo")),{headers:{"x-admin-key":k}}).then(function(r){ return r.ok?r.blob():null; }).then(function(bl){ if(bl){ img.src=URL.createObjectURL(bl); } }).catch(function(){}); });
}
function load(){ var st=document.getElementById("status"); st.textContent="Loading\u2026"; return Promise.all([api("GET"), loadData()]).then(function(rs){ Q=rs[0]; st.textContent="Loaded "+new Date().toLocaleTimeString()+" \u00b7 "+branch(); render(); }).catch(function(e){ st.textContent="Error: "+e.message; }); }
document.getElementById("load").addEventListener("click", load);
document.getElementById("key").addEventListener("keydown", function(e){ if(e.key==="Enter") load(); });
document.getElementById("app").addEventListener("click", function(ev){
  var t=ev.target.closest("button,img.ph"); if(!t) return;
  if(t.matches("img.ph")){ var lb=document.getElementById("lb"); lb.querySelector("img").src=t.src; lb.classList.add("open"); return; }
  if(t.hasAttribute("data-tab")){ TAB=t.getAttribute("data-tab"); render(); return; }
  if(t.id==="runalerts"){ t.disabled=true; var o=document.getElementById("runalerts-out"); o.textContent="Running\u2026"; api("POST",{type:"runalerts", branch:branch()}).then(function(r){ o.textContent="Done: "+r.subscribers+" subscribers, "+r.due+" due, "+r.sent+" sent, "+r.failed+" failed, "+r.removed+" removed (data "+when(r.generatedAt)+")."; t.disabled=false; }).catch(function(e){ o.textContent="Error: "+e.message; t.disabled=false; }); return; }
  if(t.id==="nt-save"){ var txt=document.getElementById("nt-text").value.trim(), lv=document.getElementById("nt-level").value, fr=document.getElementById("nt-from").value, un=document.getElementById("nt-until").value; if(!txt){ alert("Type the message, or use Clear notice."); return; } t.disabled=true; api("POST",{type:"settings", notice:{text:txt, level:lv, from: fr?new Date(fr).toISOString():null, until: un?new Date(un).toISOString():null}}).then(load).catch(function(e){ alert(e.message); t.disabled=false; }); return; }
  if(t.id==="nt-clear"){ if(!confirm("Clear the site notice?")) return; t.disabled=true; api("POST",{type:"settings", notice:null}).then(load).catch(function(e){ alert(e.message); t.disabled=false; }); return; }
  if(t.id==="toggle"){ var on=!!(Q.flags&&Q.flags.marksEnabled); t.disabled=true; api("POST",{type:"settings", marksEnabled:!on}).then(load).catch(function(e){ alert(e.message); t.disabled=false; }); return; }
  var row=t.closest("[data-type]"), a=t.getAttribute("data-a"); if(!row||!a) return;
  if(a==="delete" && !confirm("Delete permanently? This cannot be undone.")) return;
  var body={type:row.getAttribute("data-type"), id:row.getAttribute("data-id"), action:a};
  if(a==="setmile"){ body.mile=+row.querySelector(".mile").value; }
  api("POST",body).then(load).catch(function(e){ alert(e.message); });
});
document.getElementById("lb").addEventListener("click", function(){ this.classList.remove("open"); });
if(document.getElementById("key").value) load();
</script></div></body></html>
